[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = .collections
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
pipelining = True
# accept-new: trust a NEW server's host key on first contact (fresh VM has no known_hosts
# entry), but still fail hard if a known host's key ever changes.
# IdentitiesOnly: offer only ansible_ssh_private_key_file, not every agent key (the host
# enforces MaxAuthTries 3, so a busy agent, e.g. 1Password, would otherwise lock us out).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
