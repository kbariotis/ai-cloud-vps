---
- name: Configure MCP host
  hosts: all
  become: true

  pre_tasks:
    # Secrets never live in the repo: they come from the controller's environment
    # (shell exports, `op run --env-file=deploy.env`, or CI secrets). See deploy.env.example.
    - name: Read secrets from the controller environment
      ansible.builtin.set_fact:
        google_oauth_client_id: "{{ lookup('ansible.builtin.env', 'MCP_GOOGLE_OAUTH_CLIENT_ID') }}"
        google_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'MCP_GOOGLE_OAUTH_CLIENT_SECRET') }}"
        gateway_jwt_signing_key: "{{ lookup('ansible.builtin.env', 'MCP_GATEWAY_JWT_SIGNING_KEY') }}"
        github_pat: "{{ lookup('ansible.builtin.env', 'MCP_GITHUB_PAT') }}" # optional: "" = no GitHub access
      no_log: true
      tags: [always]

    - name: Required secrets are set
      ansible.builtin.assert:
        that:
          - google_oauth_client_id | length > 0
          - google_oauth_client_secret | length > 0
          - gateway_jwt_signing_key | length >= 32
          # A sourced deploy.env with op:// references would otherwise deploy the reference text
          - >-
            [google_oauth_client_id, google_oauth_client_secret, gateway_jwt_signing_key, github_pat]
            | select('match', 'op://') | list | length == 0
        fail_msg: >-
          Export MCP_GOOGLE_OAUTH_CLIENT_ID, MCP_GOOGLE_OAUTH_CLIENT_SECRET and
          MCP_GATEWAY_JWT_SIGNING_KEY (>= 32 chars); MCP_GITHUB_PAT is optional. op:// references
          must be resolved with `op run --env-file=deploy.env -- ...`. See deploy.env.example.
        quiet: true
      tags: [always]

    - name: Personal settings are filled in (inventory/host_vars/mcp.yml)
      ansible.builtin.assert:
        that:
          - mcp_domain is not search('example\.com$')
          - acme_email is not search('@example\.com$')
          - allowed_email is not search('@example\.com$')
        fail_msg: >-
          Set mcp_domain, acme_email and allowed_email in ansible/inventory/host_vars/mcp.yml
          (copy mcp.yml.example); placeholders would deploy a gateway nobody can log in to.
        quiet: true
      tags: [always]

  roles:
    - { role: base, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: stack, tags: [stack] }
