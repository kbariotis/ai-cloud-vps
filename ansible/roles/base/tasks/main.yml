---
- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - python3-debian  # required by deb822_repository
      - unattended-upgrades
      - apt-listchanges
    state: present

# Ubuntu 24.04 starts sshd on demand via ssh.socket, so its privilege-separation dir may not
# exist yet; `sshd -t` refuses to run without it. /run is tmpfs, so ensure it every run.
- name: sshd privilege separation directory (needed by sshd -t)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Validated before it is installed: with socket activation every new connection reads the
# config, so a broken file must never land (it would lock us out).
- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# Whole-config check on every run (not only on change), so a handler lost to an earlier
# failed run can't leave an unvalidated config in place.
- name: Validate full sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Host firewall is defence in depth; the Hetzner firewall is the primary edge.
# NOTE: Docker-published ports bypass ufw — only Caddy publishes ports, by design.
- name: Firewall - public web
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

# Who may reach 22 is decided at the Hetzner firewall: closed by default and opened
# just-in-time to your current IP by `make deploy` / `make ssh-open`.
- name: Firewall - SSH (source restricted upstream by the Hetzner firewall)
  community.general.ufw:
    rule: limit # also rate-limits repeated connection attempts
    port: "22"
    proto: tcp

- name: Firewall - default deny incoming, enable
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
