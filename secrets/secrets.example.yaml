# Template only — real values go in secrets.sops.yaml (encrypted):
#   cp secrets/secrets.example.yaml secrets/secrets.sops.yaml && sops -e -i secrets/secrets.sops.yaml
# Then edit with: make secrets

# Google Cloud console > APIs & Services > Credentials > OAuth client (Web application)
# Authorized redirect URIs, one per app: https://<mcp_domain>/<app>/auth/callback
google_oauth_client_id: REPLACE.apps.googleusercontent.com
google_oauth_client_secret: REPLACE

# Master key; each app gets its own derived signing key. Generate: openssl rand -hex 32
gateway_jwt_signing_key: REPLACE

# Fine-grained PAT for the sandboxes (git + gh). Never enters a sandbox: OpenShell injects
# it at its proxy, only for GitHub endpoints. Scope it to the repos in sandbox_push_repos
# with Contents: read/write and Pull requests: read/write; nothing else (no Workflows,
# no Administration). Leave "" for no GitHub access at all.
github_pat: github_pat_REPLACE
